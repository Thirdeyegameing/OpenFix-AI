[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openfix-ai"
version = "1.0.0"
description = "Local, read-only Windows PC diagnostics and troubleshooting guidance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Thirdeyegameing"}]
dependencies = [
  "PySide6>=6.6",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["openfix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
